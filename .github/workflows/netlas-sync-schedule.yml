name: Netlas Scheduled Sync

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlas-sync-schedule
  cancel-in-progress: false

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger production sync endpoint
        env:
          CRON_ENDPOINT_URL: ${{ secrets.CRON_ENDPOINT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_ENDPOINT_URL" ]; then
            echo "CRON_ENDPOINT_URL secret is required"
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is required"
            exit 1
          fi

          response_file="$(mktemp)"
          status_code="$(curl -sS -o "$response_file" -w "%{http_code}" \
            -X GET "$CRON_ENDPOINT_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "User-Agent: claw-radar-github-cron/1.0" \
            --max-time 120)"

          echo "HTTP status: $status_code"
          cat "$response_file"
          echo

          if [ "$status_code" -lt 200 ] || [ "$status_code" -ge 300 ]; then
            echo "Sync trigger failed"
            exit 1
          fi
