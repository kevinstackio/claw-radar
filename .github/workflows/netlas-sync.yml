name: Netlas Sync

on:
  schedule:
    # 01:00 Asia/Shanghai = 17:00 UTC (previous day)
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      max_keys:
        description: "Max Netlas API keys to validate in this run"
        required: false
        default: "2"

permissions:
  contents: read

concurrency:
  group: netlas-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: production
      EXPOSURE_DATA_SOURCE: database
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NETLAS_ENCRYPTION_KEY: ${{ secrets.NETLAS_ENCRYPTION_KEY }}
      NETLAS_API_KEYS: ${{ secrets.NETLAS_API_KEYS }}
      NETLAS_API_KEY: ${{ secrets.NETLAS_API_KEY }}
      NETLAS_QUERY: ${{ vars.NETLAS_QUERY }}
      NETLAS_BASE_URL: ${{ vars.NETLAS_BASE_URL }}
      NETLAS_TIMEOUT_MS: ${{ vars.NETLAS_TIMEOUT_MS }}
      NETLAS_VALIDATION_QUERY: ${{ vars.NETLAS_VALIDATION_QUERY }}
      NETLAS_VALIDATION_START: ${{ vars.NETLAS_VALIDATION_START }}
      NETLAS_VALIDATION_MAX_KEYS: ${{ github.event.inputs.max_keys || vars.NETLAS_VALIDATION_MAX_KEYS || '2' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate required configuration
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "Missing required secret: DATABASE_URL"
            exit 1
          fi

          if [ -z "${NETLAS_ENCRYPTION_KEY:-}" ]; then
            echo "Missing required secret: NETLAS_ENCRYPTION_KEY"
            exit 1
          fi

          if [ -z "${NETLAS_API_KEYS:-}" ] && [ -z "${NETLAS_API_KEY:-}" ]; then
            echo "Missing required secret: NETLAS_API_KEYS or NETLAS_API_KEY"
            exit 1
          fi

      - name: Run Netlas sync
        run: node scripts/validate-netlas-neon.mjs
